# The fixtures' rules: the table a consumer would supply, with one exception.
layout = "crates"
dev_checked = ["adapters/driven", "adapters/driving"]

[classes]
presentation = ["fx-presentation", "*-presentation"]

[roles."core/wire"]
allow = ["core/wire"]
rule = "the core depends on the core only"

[roles."core/domain"]
allow = ["core/domain", "core/wire"]
rule = "a domain never depends on a read model"

[roles."core/read-model"]
allow = ["core/read-model", "core/domain", "core/wire"]
rule = "a read model never depends on the application layer"

[roles."core/ports"]
allow = ["core/ports", "core/domain", "core/wire"]

[roles."core/application"]
allow = ["core/*"]
rule = "nothing but the root depends on the root"

[roles."adapters/driven"]
allow = ["core/ports", "core/wire"]
rule = "a driven adapter sees only ports"

[roles."adapters/driving"]
allow = ["core/application", "@presentation"]
rule = "a driving adapter sees only the application layer"

[roles."root/bin"]
allow = ["*"]

[[exception]]
from = "fx-driven-b"
to = "fx-readmodel"
kind = "dev"
reason = "a fixture's known debt"

[[exception]]
from = "fx-ghost"
to = "fx-wire"
reason = "an exception that matches nothing"
