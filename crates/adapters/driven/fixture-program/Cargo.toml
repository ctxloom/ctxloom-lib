[package]
name = "fixture-program"
version = "0.1.0"
description = "Test support: a fake program (a script) a test can run by path, which is never exec'd as written, so no thread's fork can make running it fail with ETXTBSY."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
file-system.workspace = true
os.workspace = true

[dev-dependencies]
file-system = { workspace = true, features = ["test-support"] }
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
