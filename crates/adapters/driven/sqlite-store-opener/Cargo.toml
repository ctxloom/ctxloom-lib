[package]
name = "sqlite-store-opener"
version = "0.1.0"
description = "Places and opens a project's SQLite event store under a caller-chosen file name."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
# The store: angzarr-store-sqlite, through angzarr-embedded's re-export (its
# `sqlite` feature), at the rev the consumers' kernels are built with.
angzarr-embedded = { workspace = true, features = ["sqlite"] }
file-system.workspace = true
os.workspace = true

[dev-dependencies]
file-system = { workspace = true, features = ["test-support"] }
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }
tokio.workspace = true

[build-dependencies]
# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
angzarr-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their dev-dependency
# turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
