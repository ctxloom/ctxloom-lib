# The gates, on every push and pull request: build, fmt-check, lint
# (including the vocabulary rule), lint-os, lint-deps and test. Mutation testing is a
# by-hand close-out step (CLAUDE.md), in no workflow.
#
# A plain checkout: every dependency outside this repository is a git
# dependency pinned by commit (Cargo.toml). The gates are in the repository
# (gates/).
#
# Every action is pinned to a commit, its release in the comment; every tool
# to a version.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  TOOLS: just@1.40.0,cargo-nextest@0.9.146,cargo-deny@0.20.2

jobs:
  linux:
    name: gates (linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: ${{ env.TOOLS }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just build
      - run: just fmt-check
      - run: just lint
      - run: just lint-os
      - run: just lint-deps
      - run: just test
      - name: The gates' logs
        if: failure()
        run: shopt -s nullglob; for log in target/logs/*.log; do echo "::group::$log"; cat "$log"; echo "::endgroup::"; done
