[workspace]
resolver = "2"
members = ["crates/*/*/*"]

[workspace.package]
edition = "2021"
# The newest any dependency needs (angzarr-build in the consumers); a lower
# claim would be false for CI. ctxloom-rs, which declares 1.85, re-checks its
# own claim when it first links this repository.
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# The angzarr crates are pinned to the SAME commits as ctxloom-rs and
# taskloom pin them, so a consumer's lock holds one of each: a bump lands here
# first, then in taskloom, then in ctxloom-rs, each green. Full commits, never
# a branch.
#
# angzarr core (angzarr-diagnostic, angzarr-yaml, angzarr-presentation).
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "7225592247ae8d478dda64b5f154106b9b560b74" }
angzarr-yaml = { git = "https://github.com/angzarr-io/angzarr", rev = "7225592247ae8d478dda64b5f154106b9b560b74" }
angzarr-presentation = { git = "https://github.com/angzarr-io/angzarr", rev = "7225592247ae8d478dda64b5f154106b9b560b74" }
# angzarr-platform (the OS seam and the filesystem seam over it).
os = { git = "https://github.com/angzarr-io/angzarr-platform", rev = "f954758b3ded8d38236bebe0b4e5cc877980d392" }
file-system = { git = "https://github.com/angzarr-io/angzarr-platform", rev = "f954758b3ded8d38236bebe0b4e5cc877980d392" }
# angzarr-embedded (its `sqlite` feature re-exports the SQLite store).
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "ffc58aab8957e81a489e4064f6b6880e1e56ef7e" }

# This repository's own crates.
cli-support = { path = "crates/adapters/driving/cli-support" }
config-layers = { path = "crates/adapters/driven/config-layers" }
sqlite-store-opener = { path = "crates/adapters/driven/sqlite-store-opener" }
process-env = { path = "crates/root/lib/process-env" }
project-dir = { path = "crates/adapters/driven/project-dir" }
duration-text = { path = "crates/core/domain/duration-text" }

# The command-line parser and the serializer the CLI shims read and write with.
clap = "4.5"
serde = { version = "1", features = ["derive"] }

# `#[mutants::skip]`, for a mutant judged equivalent.
mutants = "0.0.4"

[workspace.lints.clippy]
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
