[workspace]
resolver = "2"
members = ["crates/*/*/*"]

[workspace.package]
edition = "2021"
# The newest any dependency needs (angzarr-build in the consumers); a lower
# claim would be false for CI. ctxloom-rs, which declares 1.85, re-checks its
# own claim when it first links this repository.
rust-version = "1.96"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# The angzarr crates are pinned to the SAME commits as ctxloom-rs and
# taskloom pin them, so a consumer's lock holds one of each: a bump lands here
# first, then in taskloom, then in ctxloom-rs, each green. Full commits, never
# a branch.
#
# angzarr core (angzarr-diagnostic, angzarr-yaml, angzarr-presentation).
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "dd59566a017474732a344caf3d1c8fc26d90481b" }
angzarr-yaml = { git = "https://github.com/angzarr-io/angzarr", rev = "dd59566a017474732a344caf3d1c8fc26d90481b" }
angzarr-presentation = { git = "https://github.com/angzarr-io/angzarr", rev = "dd59566a017474732a344caf3d1c8fc26d90481b" }
# angzarr-platform (the OS seam and the filesystem seam over it).
os = { git = "https://github.com/angzarr-io/angzarr-platform", rev = "7b448a82293746f430e0f962d1e9d1beede78c7c" }
file-system = { git = "https://github.com/angzarr-io/angzarr-platform", rev = "7b448a82293746f430e0f962d1e9d1beede78c7c" }
# angzarr-embedded (its `sqlite` feature re-exports the SQLite store).
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr-embedded", rev = "9db929911aa1b06db9ea68321a0bc91c49ff108e" }

# This repository's own crates.
cli-support = { path = "crates/adapters/driving/cli-support" }
config-layers = { path = "crates/adapters/driven/config-layers" }
sqlite-store-opener = { path = "crates/adapters/driven/sqlite-store-opener" }
process-env = { path = "crates/root/lib/process-env" }
project-dir = { path = "crates/adapters/driven/project-dir" }
run-within = { path = "crates/adapters/driven/run-within" }
fixture-program = { path = "crates/adapters/driven/fixture-program" }
duration-text = { path = "crates/core/domain/duration-text" }
arch-lint = { path = "crates/root/bin/arch-lint" }

# The command-line parser and the serializer the CLI shims read and write with.
clap = "4.5"
serde = { version = "1", features = ["derive"] }

# The dependency graph as cargo reports it (arch-lint), and the rules file it
# reads.
cargo_metadata = "0.23"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# The runtime the store's tests run its async opens on.
tokio = { version = "1", features = ["rt", "time"] }

# `#[mutants::skip]`, for a mutant judged equivalent.
mutants = "0.0.4"

[workspace.lints.clippy]
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
